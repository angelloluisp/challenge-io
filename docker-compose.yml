version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: card_user
      POSTGRES_PASSWORD: card_password
      POSTGRES_DB: card_issuer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card_user -d card_issuer"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - card-network

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - card-network

  kafka-topics-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic io.card.requested.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic io.cards.issued.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic io.card.requested.v1.dlq --partitions 3 --replication-factor 1
    networks:
      - card-network

  card-issuer:
    build:
      context: .
      dockerfile: Dockerfile.card-issuer
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://card_user:card_password@postgres:5432/card_issuer?schema=public
      KAFKA_BROKERS: kafka:9092
      CARD_ISSUER_PORT: "3000"
      CORS_ORIGIN: http://localhost:3000
      OUTBOX_POLL_INTERVAL_MS: "500"
      OUTBOX_BATCH_SIZE: "20"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
    command: sh -c "npx prisma migrate deploy --schema prisma/schema.prisma && node dist/apps/card-issuer/apps/card-issuer/src/main.js"
    networks:
      - card-network

  card-processor:
    build:
      context: .
      dockerfile: Dockerfile.card-processor
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://card_user:card_password@postgres:5432/card_issuer?schema=public
      KAFKA_BROKERS: kafka:9092
      CARD_PROCESSOR_PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      card-issuer:
        condition: service_started
    networks:
      - card-network

networks:
  card-network:
    driver: bridge

volumes:
  postgres_data:
